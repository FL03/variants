name: crates-io

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

on:
  repository_dispatch:
    types: [ cargo-publish, crates-io ]
  workflow_dispatch:

permissions:
  contents: write
  discussions: write
  packages: write

jobs:
  crates-io:
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    environment:
      name: crates-io
      url: https://crates.io/crates/variants
    outputs:
      url: https://crates.io/crates/${{ matrix.package }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        package:
          - variants-derive
          - variants-macros
          - variants
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      -
        id: publish
        name: Publish (${{ matrix.package }})
        run: cargo publish --locked --package ${{ matrix.package }}
